# TLSHost — Nginx site config for a Hostinger VPS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tlshost
#   sudo ln -s /etc/nginx/sites-available/tlshost /etc/nginx/sites-enabled/tlshost
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (this rewrites the TLS lines below for you):
#   sudo certbot --nginx -d tlshost.vn -d www.tlshost.vn

upstream tlshost_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS. Certbot keeps the ACME challenge location working.
server {
    listen 80;
    listen [::]:80;
    server_name tlshost.vn www.tlshost.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Send the www host to the bare domain so only one origin is canonical.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tlshost.vn;

    ssl_certificate     /etc/letsencrypt/live/tlshost.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlshost.vn/privkey.pem;

    return 301 https://tlshost.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tlshost.vn;

    ssl_certificate     /etc/letsencrypt/live/tlshost.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlshost.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. Only enable this once HTTPS is confirmed working on every subdomain,
    # because browsers cache it and it is hard to walk back.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # Build output is content-hashed, so it can be cached forever.
    location /_next/static/ {
        proxy_pass http://tlshost_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # next/font self-hosts its files under this path with hashed names too.
    location /_next/image {
        proxy_pass http://tlshost_app;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.ico {
        proxy_pass http://tlshost_app;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://tlshost_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
    }
}
